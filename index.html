<html>


<head>
    <meta charset="UTF-8">
    <title>Teacher Application</title>
</head>

<body style="background-color: #eef4f8; color: #263238;">

    <div style="background-color: #ffffff; width: 80%; margin: 30px auto; padding: 30px; border-radius: 15px;">

        <h1 style="color: #234e70; text-align: center;">
            Application For Teacher Position
        </h1>

        <p style="color: #607d8b; text-align: center;">
            <b>Please fill in your personal data</b>
        </p>


        <form>

            <!-- Personal Information -->

            <fieldset style="border: 2px solid #b7cbd8; border-radius: 10px; padding: 20px;">

                <legend style="color: #234e70;">
                    <b>Personal Information</b>
                </legend>


                <label for="full-name">
                    <b>Full Name</b>
                </label>
                <br>

                <input
                    id="full-name"
                    type="text"
                    name="full-name"
                    placeholder="Enter your full name"
                    required
                    style="padding: 10px; width: 95%; border: 1px solid #b7cbd8; border-radius: 6px;"
                >


                <br><br>


                <label for="email">
                    <b>Email</b>
                </label>
                <br>

                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="example@mail.com"
                    required
                    style="padding: 10px; width: 95%; border: 1px solid #b7cbd8; border-radius: 6px;"
                >


                <br><br>


                <label for="age">
                    <b>Age</b>
                </label>
                <br>

                <input
                    id="age"
                    type="number"
                    name="age"
                    placeholder="e.g. 28"
                    min="18"
                    max="40"
                    required
                    style="padding: 10px; width: 95%; border: 1px solid #b7cbd8; border-radius: 6px;"
                >


                <br><br>


                <label for="phone">
                    <b>Phone Number</b>
                </label>
                <br>

                <input
                    id="phone"
                    type="tel"
                    name="phone"
                    placeholder="01xxxxxxxxx"
                    minlength="11"
                    maxlength="11"
                    required
                    style="padding: 10px; width: 95%; border: 1px solid #b7cbd8; border-radius: 6px;"
                >


                <br><br>


                <label for="date-of-birth">
                    <b>Date of Birth</b>
                </label>
                <br>

                <input
                    id="date-of-birth"
                    type="date"
                    name="date-of-birth"
                    required
                    style="padding: 10px; border: 1px solid #b7cbd8; border-radius: 6px;"
                >


                <br><br>


                <p><b>Gender</b></p>

                <input
                    id="male"
                    type="radio"
                    name="gender"
                    value="male"
                    required
                >

                <label for="male">
                    Male
                </label>

                <br>

                <input
                    id="female"
                    type="radio"
                    name="gender"
                    value="female"
                >

                <label for="female">
                    Female
                </label>


                <br><br>


                <label for="personal-photo">
                    <b>Upload Personal Photo</b>
                </label>
                <br>

                <input
                    id="personal-photo"
                    type="file"
                    name="personal-photo"
                    required
                >

            </fieldset>


            <br>


            <!-- Qualification -->

            <fieldset style="border: 2px solid #b7cbd8; border-radius: 10px; padding: 20px;">

                <legend style="color: #234e70;">
                    <b>Qualification</b>
                </legend>


                <label for="faculty">
                    <b>Graduation / Faculty</b>
                </label>
                <br>

                <input
                    id="faculty"
                    type="text"
                    name="faculty"
                    placeholder="e.g. Faculty of Education"
                    required
                    style="padding: 10px; width: 95%; border: 1px solid #b7cbd8; border-radius: 6px;"
                >


                <br><br>


                <label for="graduation-year">
                    <b>Graduation Year</b>
                </label>
                <br>

                <input
                    id="graduation-year"
                    type="number"
                    name="graduation-year"
                    min="2000"
                    max="2026"
                    placeholder="yyyy"
                    required
                    style="padding: 10px; width: 95%; border: 1px solid #b7cbd8; border-radius: 6px;"
                >


                <br><br>


                <label for="graduation-grade">
                    <b>Graduation Grade</b>
                </label>
                <br>

                <select
                    id="graduation-grade"
                    name="graduation-grade"
                    required
                    style="padding: 10px; width: 98%; border: 1px solid #b7cbd8; border-radius: 6px;"
                >

                    <option value="" selected disabled>
                        Select your grade
                    </option>

                    <option value="excellent">
                        Excellent
                    </option>

                    <option value="very-good">
                        Very Good
                    </option>

                    <option value="good">
                        Good
                    </option>

                    <option value="pass">
                        Pass
                    </option>

                </select>


                <br><br>


                <label for="experience">
                    <b>Years of Teaching Experience</b>
                </label>
                <br>

                <input
                    id="experience"
                    type="number"
                    name="experience"
                    min="2"
                    max="20"
                    placeholder="e.g. 5"
                    required
                    style="padding: 10px; width: 95%; border: 1px solid #b7cbd8; border-radius: 6px;"
                >


                <br><br>


                <label for="cv">
                    <b>Upload CV (PDF)</b>
                </label>
                <br>

                <input
                    id="cv"
                    type="file"
                    name="cv"
                    accept=".pdf"
                    required
                >

            </fieldset>


            <br>


            <!-- Course Selection -->

            <fieldset style="border: 2px solid #b7cbd8; border-radius: 10px; padding: 20px;">

                <legend style="color: #234e70;">
                    <b>Course Selection</b>
                </legend>


                <p>
                    <b>Select the courses you can teach:</b>
                </p>


                <input
                    id="teaching-methods"
                    type="checkbox"
                    name="courses"
                    value="teaching-methods"
                >

                <label for="teaching-methods">
                    Teaching Methods
                </label>


                <br>


                <input
                    id="classroom-management"
                    type="checkbox"
                    name="courses"
                    value="classroom-management"
                >

                <label for="classroom-management">
                    Classroom Management
                </label>


                <br>


                <input
                    id="early-childhood"
                    type="checkbox"
                    name="courses"
                    value="early-childhood"
                >

                <label for="early-childhood">
                    Early Childhood Education
                </label>


                <br>


                <input
                    id="special-needs"
                    type="checkbox"
                    name="courses"
                    value="special-needs"
                >

                <label for="special-needs">
                    Special Needs Education
                </label>


                <br><br>


                <label for="start-time">
                    <b>Preferred Start Time</b>
                </label>
                <br>

                <input
                    id="start-time"
                    type="time"
                    name="start-time"
                    required
                    style="padding: 10px; border: 1px solid #b7cbd8; border-radius: 6px;"
                >

            </fieldset>


            <br>


            <!-- Why Do You Want To Join -->

            <fieldset style="border: 2px solid #b7cbd8; border-radius: 10px; padding: 20px;">

                <legend style="color: #234e70;">
                    <b>Why Do You Want To Join?</b>
                </legend>


                <textarea
                    name="reason"
                    rows="10"
                    cols="50"
                    maxlength="200"
                    placeholder="Tell us why you want to join..."
                    required
                    style="padding: 10px; width: 95%; border: 1px solid #b7cbd8; border-radius: 6px;"
                ></textarea>

            </fieldset>


            <br>


            <!-- Preferred Branch -->

            <fieldset style="border: 2px solid #b7cbd8; border-radius: 10px; padding: 20px;">

                <legend style="color: #234e70;">
                    <b>Preferred Branch</b>
                </legend>


                <label for="branch">
                    <b>Choose your preferred branch</b>
                </label>
                <br>

                <select
                    id="branch"
                    name="branch"
                    required
                    style="padding: 10px; width: 98%; border: 1px solid #b7cbd8; border-radius: 6px;"
                >

                    <option value="" selected disabled>
                        Select a branch
                    </option>

                    <option value="alexandria">
                        Alexandria Branch
                    </option>

                    <option value="cairo">
                        Cairo Branch
                    </option>

                    <option value="online">
                        Online
                    </option>

                </select>

            </fieldset>


            <br>


            <!-- Additional Settings -->

            <fieldset style="border: 2px solid #b7cbd8; border-radius: 10px; padding: 20px;">

                <legend style="color: #234e70;">
                    <b>Additional Settings</b>
                </legend>


                <label for="favorite-color">
                    <b>Favorite Color</b>
                </label>
                <br>

                <input
                    id="favorite-color"
                    type="color"
                    name="favorite-color"
                >


                <br><br>


                <label for="join-date">
                    <b>Preferred Join Date</b>
                </label>
                <br>

                <input
                    id="join-date"
                    type="date"
                    name="join-date"
                    required
                    style="padding: 10px; border: 1px solid #b7cbd8; border-radius: 6px;"
                >

            </fieldset>


            <br><br>


            <input
                type="submit"
                value="Submit Application"
                style="background-color: #234e70; color: white; padding: 12px 25px; border: none; border-radius: 7px; cursor: pointer;"
            >

            <input
                type="reset"
                value="Reset"
                style="background-color: #90a4ae; color: white; padding: 12px 25px; border: none; border-radius: 7px; cursor: pointer;"
            >

        </form>

    </div>

</body>

</html>
